<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{{ ui_head }}}
{{{ htmx }}}
<title>{{ title }} — RoboHub Keeper</title>
<style>
  /* What only the keeper's own pages have; the look itself is robohub.ui's. */
  .app-status { display: inline-block; font: 700 .58rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; border-radius: 5px; padding: .26rem .42rem; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .app-status.status-running { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 45%, transparent); background: var(--teal-soft); }
  .app-status.status-busy, .app-status.status-not-built { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: var(--warn-soft); }
  .app-status.status-failed { color: var(--stop); border-color: color-mix(in srgb, var(--stop) 50%, transparent); background: var(--stop-soft); }
  .app-actions { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
  .app-actions form { display: inline-flex; }
  .app-actions .button, .app-actions button { padding: .3rem .55rem; font-size: .74rem; }
  .app-install { margin-top: 1.5rem; }
  .rh-ins-page .its-page { display: none; }
  .auth-token-row { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; }
  .auth-token-row input { flex: 1; min-width: 0; }
</style>
</head>
<body class="rh">
{{{ topbar }}}
<div class="rh-shell">
  <nav class="rh-rail">{{{ nav }}}</nav>
  <main class="rh-main">{{{ body }}}</main>
</div>
{{{ notifications }}}
<footer class="rh-strip" id="job-strip" hx-get="/jobs/strip" hx-trigger="load, every 3s" hx-swap="innerHTML"></footer>
</body>
</html>
