{{{ open }}}
{{#unless is_keeper}}
  {{#if running}}
  <form method="post" action="/applications/stop" hx-post="/applications/stop" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet">{{t "common.stop"}}</button></form>
  <form method="post" action="/applications/restart" hx-post="/applications/restart" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet">{{t "common.restart"}}</button></form>
  {{/if}}
  {{#unless running}}
  <form method="post" action="/applications/start" hx-post="/applications/start" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit">{{t "common.start"}}</button></form>
  {{/unless}}
  <form method="post" action="/applications/build" hx-post="/applications/build" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet" title="{{t "apps.build_title"}}">{{t "common.build"}}</button></form>
  <form method="post" action="/applications/redeploy" hx-post="/applications/redeploy" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet" title="{{t "apps.redeploy_title"}}" hx-confirm="{{ redeploy_confirm }}">{{t "common.redeploy"}}</button></form>
{{/unless}}
{{#if pinned}}
<form method="post" action="/applications/menu" hx-post="/applications/menu" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="pinned" value="0"><button type="submit" class="quiet">{{t "apps.remove_from_menu"}}</button></form>
{{/if}}
{{#unless pinned}}
<form method="post" action="/applications/menu" hx-post="/applications/menu" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="pinned" value="1"><button type="submit" class="quiet">{{t "apps.add_to_menu"}}</button></form>
{{/unless}}
{{#unless is_keeper}}
<form method="post" action="/applications/uninstall" hx-post="/applications/uninstall" hx-target="closest tr" hx-swap="outerHTML" hx-confirm="{{ uninstall_confirm }}"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="origin" value="{{ origin }}"><button type="submit" class="danger" title="{{ hint }}">{{t "common.uninstall"}}</button></form>
{{/unless}}
