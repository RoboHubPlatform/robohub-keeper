{{#if enabled}}<form method="post" action="/plugins/toggle" hx-post="/plugins/toggle" hx-target="closest .rh-card" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="enabled" value="0"><button type="submit" class="quiet">{{t "common.disable"}}</button></form>{{else}}<form method="post" action="/plugins/toggle" hx-post="/plugins/toggle" hx-target="closest .rh-card" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="enabled" value="1"><button type="submit">{{t "common.enable"}}</button></form>{{/if}} <form method="post" action="/plugins/test" hx-post="/plugins/test" hx-target="closest .rh-card" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet">{{t "plugins.send_test"}}</button></form>
