<style>
.settings-layout { display: flex; align-items: stretch; width: 100%; max-width: 980px; min-height: 360px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.settings-tabs { flex: 0 0 13rem; display: flex; flex-direction: column; gap: .15rem; padding: .6rem; border-right: 1px solid var(--line); background: var(--panel); }
.settings-tabs a { display: block; padding: .5rem .7rem; border-radius: 8px; color: var(--muted) !important; font-size: .85rem; }
.settings-tabs a:hover { background: var(--wash); text-decoration: none; }
.settings-tabs a.active { color: var(--ink) !important; background: var(--gold-soft); box-shadow: inset 3px 0 0 var(--gold); }
.settings { flex: 1 1 auto; min-width: 0; padding: 1.1rem 1.3rem; }
.settings dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; }
.settings dt { color: var(--faint); }
.settings dd { margin: 0; }
@media (max-width: 760px) { .settings-layout { flex-direction: column; } .settings-tabs { flex: none; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
<h1>{{t "page.settings"}}</h1>
<p>{{t "settings.intro"}}</p>
{{{ notice }}}
<div class="settings-layout">
  {{{ nav }}}
  <section class="settings">{{{ tab_content }}}</section>
</div>
