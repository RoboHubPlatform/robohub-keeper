# The documentation the keeper serves: /docs in src/main.rho, through the
# docstore port.
level: SUB
prefix: KEEP-DOCS
title: Documentation
requirements:
  - id: KEEP-DOCS-0001
    title: A documentation page is a name under the tree, shown as text
    statement: >
      `/docs/<path>` shall render only a page under the documentation tree,
      answering 404 for a path with `..`, a leading `/` or a backslash and for a
      page that does not exist, with the requested path shown escaped, never as
      markup.
    rationale: The address of a page must not be a way out of the tree or into the page's HTML.
    satisfies: [KEEP-0011, KEEP-0013]
    status: proposed
    verification: test
    owner: maintainer
    changed: 2026-11-19
    tags: [docs, security]

  - id: KEEP-DOCS-0002
    title: The documentation is listed from the generator's store
    statement: >
      `/docs` shall list the pages the documentation store holds for the tree,
      and a page shall be rendered by the same generator a documentation build
      uses, including a module's pages kept in `docs/doc/`.
    rationale: A page served here and a page the site build writes are the same page.
    satisfies: [KEEP-0011]
    status: proposed
    verification: demonstration
    owner: maintainer
    changed: 2026-11-19
    tags: [docs]
