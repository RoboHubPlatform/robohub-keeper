# What the keeper go-server target has that the toolchain's built-in one does
# not. The files, the kind, the router and the output folders are the built-in
# target's.

targets:
  - id: go-server
    api:
      public_paths: "/, /modules, /applications, /plugins, /providers, /app-modules, /auth/login, /docs"
    middleware:
      # A form posted from another origin is refused before anything else:
      # every application this keeper hosts is another port of the same host,
      # which a SameSite cookie does not tell apart. Programs that post to the
      # keeper send no browser headers and are not affected.
      - name: same_origin
      - name: auth
        options:
          issuer: keeper
          audience: keeper
          cookie: keeper_session
          login_url: "/auth/login?audience=keeper"
          session_file: ~/.rho/keeper/auth-sessions.txt
          # /app/<name>/… only redirects to an application's own port, which
          # signs the person in itself: an old link needs no keeper session.
          # /api/v1/bus/users (and /api/v1/bus/users/<name>) takes no session or
          # ticket: an application proves itself with its own broker password on
          # a loopback connection, which the handler checks (ADR-0006).
          # /api/v1/helpers (and what is under it) likewise: an application
          # proves itself with its own client secret on a loopback connection
          # (ADR-0018).
          skip_paths: /app,/api/v1/switcher,/api/v1/bus/users,/api/v1/helpers,/auth/session,/ui,/auth/login,/auth/service-token,/auth/public-key,/api/enroll,/api/nodes/verify,/i18n,/healthz,/assets,/assets/,/static
    default_locale: en
    locales:
      - locale: en
        file: locales/en.json
      - locale: ro
        file: locales/ro.json
    # Every file under templates/ is a template, named by its file name.
    templates:
      - dir: templates
