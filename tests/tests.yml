# The keeper's test suites.
#
# A suite is declared rather than discovered: the Rho unit tests check the
# registry's string helpers, and the smoke suite builds and walks the
# applications page over HTTP.

name: keeper
suites:
  - name: tests/apps_test.rho
    kind: rho
    tags: [unit, rho]
  - name: tests/enrollment_test.rho
    kind: rho
    tags: [unit, rho, enrollment]
  - name: tests/developer_test.rho
    kind: rho
    tags: [unit, rho, developer]
  - name: tests/bus_users_test.rho
    kind: rho
    tags: [unit, rho, mqtt]
  # @verifies KEEP-APPS-0017, KEEP-APPS-0018, KEEP-APPS-0019, KEEP-APPS-0020, KEEP-APPS-0021
  - name: tests/helpers_test.rho
    kind: rho
    tags: [unit, rho, supervision]
  # @verifies KEEP-AUTH-0001, KEEP-AUTH-0004, KEEP-AUTH-0006, KEEP-AUTH-0015
  # @verifies KEEP-APPS-0001, KEEP-APPS-0002, KEEP-APPS-0004, KEEP-APPS-0005
  # @verifies KEEP-APPS-0008, KEEP-APPS-0009, KEEP-APPS-0010, KEEP-APPS-0011
  # @verifies KEEP-APPS-0014, KEEP-APPS-0015, KEEP-APPS-0016
  # @verifies KEEP-DOCS-0001, KEEP-PROV-0001, KEEP-PROV-0002, KEEP-PROV-0003
  - name: apps-smoke
    kind: command
    tags: [smoke]
    command: [python3, tests/apps_smoke.py]
  # @verifies KEEP-ENROLL-0001, KEEP-ENROLL-0002, KEEP-ENROLL-0003, KEEP-ENROLL-0004
  # @verifies KEEP-ENROLL-0005, KEEP-ENROLL-0006, KEEP-ENROLL-0007
  - name: enroll-smoke
    kind: command
    tags: [smoke, enrollment]
    command: [python3, tests/enroll_smoke.py]
  # @verifies KEEP-DEV-0001, KEEP-DEV-0002, KEEP-DEV-0004, KEEP-DEV-0005
  # @verifies KEEP-DEV-0007, KEEP-DEV-0008
  - name: developer-smoke
    kind: command
    tags: [smoke, developer]
    command: [python3, tests/developer_smoke.py]
  # @verifies KEEP-AUTH-0014, KEEP-ENROLL-0008
  - name: forms-smoke
    kind: command
    tags: [smoke, security]
    command: [python3, tests/forms_smoke.py]
  # @verifies KEEP-PROV-0006, KEEP-PROV-0007, KEEP-PROV-0008, KEEP-0016
  - name: bus-users-smoke
    kind: command
    tags: [smoke, mqtt, security]
    command: [python3, tests/bus_users_smoke.py]
  # @verifies KEEP-APPS-0017, KEEP-APPS-0018, KEEP-APPS-0019, KEEP-APPS-0020, KEEP-APPS-0021
  - name: helpers-smoke
    kind: command
    tags: [smoke, supervision, security]
    command: [python3, tests/helpers_smoke.py]
