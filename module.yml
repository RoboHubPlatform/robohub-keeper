module:
  name: keeper
  id: robohub.app.keeper
  previous_ids:
    - robohub.applications.keeper
  type: rho
  kind: keeper
  title: RoboHub Keeper
  route: /
  port: "19090"
  command: keeper
  version: 0.9.13
  author: Aurel Miron
  maintainer: Aurel Miron
  license: "MIT"
description: A local dashboard for the RoboHub ecosystem — its registry, what is installed, and what it needs
main: src/main.rho

# The RoboHub platform, whose mqtt port the keeper uses to show the broker's live
# topics.
platform: robohub

# The host port that supplies the docs_* functions the keeper's pages call: the
# documentation store renders through the same generator the toolchain uses.
ports:
  - docstore
  - mqtt

build:
  language: go
  targets:
    - go-server

# The application's own files, embedded when it is built.
assets:
  - module.yml

# The notifications module keeps what it shows in the host's SQL database.
requires:
  - name: rho/sqlite

sql:
  driver: rho-sql-sqlite
  schema: db/schema.sql
  out: src/db

deps:
  rho-log: ">=0.1.2"
  rho-sql: ">=0.1.0"
  robohub:
    ui: ">=0.1.2"
    notifications: ">=0.1.0"
    htmx: ">=0.1.0"
    i18n: ">=0.4.0"
    settings: ">=0.1.0"
    logging: ">=0.1.0"
    forms: ">=0.1.0"
    robohub-alert: ">=1.0.0"
    robohub-provider-log: ">=0.2.0"
    robohub-provider-email: ">=0.2.0"
    robohub-provider-telegram: ">=0.2.0"

# The keeper is the application a person is already looking at, and the one
# that runs the others. The block is what makes it the first row of its own
# registry and what stops that registry offering to remove it.

# The alert channels the keeper raises its alerts through, and their settings.
# The Settings page changes them on a running installation (bind.conf in the
# keeper's workspace, or ~/.rho/apps/keeper when it is started by hand); these
# are the defaults.
bind:
  robohub.alert:
    providers:
      - robohub-provider-log
      - robohub-provider-email
      - robohub-provider-telegram
    config:
      robohub-provider-log:
        path: "~/.rho/keeper/alerts.log"
        severity_threshold: INFO
      robohub-provider-email:
        enabled: "false"
        mode: local
        from_address: "alerts@robohub.internal"
        to_address: "ops@robohub.internal"
        subject_template: "[RoboHub {app}] {level}: {rule}"
        body_template: "{message}"
        severity_threshold: ERROR
      robohub-provider-telegram:
        enabled: "false"
        bot_token: ""
        chat_id: ""
        severity_threshold: WARNING

deploy:
  port: 19090
  service: robohub-keeper

docs:
  title: The RoboHub keeper
  section: applications
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md

# What the keeper needs from the machine: it builds applications with the Rho
# toolchain (and Go through it), clones them with git, runs them as systemd user
# units and reads their journal, probes them with curl, and runs one job at a
# time per application under flock.
system_deps:
  executables:
    - name: rho
      description: applications are built and tickets are minted with it
      install:
        manual: https://rho-lang.org/install
    - name: go
      version: ">=1.21"
      version_flag: "version"
      version_pattern: 'go([0-9][0-9.]*)'
      description: the Go backend compiles every RoboHub application with it
      install:
        apt: golang-go
        brew: go
        manual: https://go.dev/dl/
    - name: git
      description: an application installed from a git URL is cloned with it
      install:
        apt: git
        brew: git
    - name: curl
      description: an application's health is asked with it
      install:
        apt: curl
        brew: curl
    - name: flock
      description: one job at a time per application
      install:
        apt: util-linux
        brew: flock
    - name: systemctl
      description: applications run as systemd user units
      install:
        apt: systemd
    - name: journalctl
      description: an application's log is read from the journal
      install:
        apt: systemd
